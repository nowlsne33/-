<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>영어 발표 카운터</title>
<style>
  :root{
    --bg:#F4F8FB; --card:#FFFFFF; --ink:#1E3040; --sub:#7A8C9C;
    --blue:#2E7CF6; --blue-soft:#E3EEFF; --blue-deep:#1B5FD0;
    --gold:#F5B301; --line:#E4ECF3; --green:#2FA36B; --red:#D64545;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Segoe UI",sans-serif;
    min-height:100vh; padding-bottom:80px;
  }
  header{
    background:var(--card); border-bottom:1px solid var(--line);
    padding:18px 22px; display:flex; align-items:center; gap:12px; flex-wrap:wrap;
    position:sticky; top:0; z-index:10;
  }
  .logo{font-size:20px; font-weight:800;}
  .logo span{color:var(--blue);}
  .sync{font-size:12px; color:var(--sub); margin-left:auto; display:flex; align-items:center; gap:6px;}
  .dot{width:8px; height:8px; border-radius:50%; background:#C6CFD8;}
  .dot.ok{background:var(--green);}
  .dot.bad{background:var(--red);}
  main{max-width:760px; margin:0 auto; padding:20px 16px;}
  .toolbar{display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; align-items:center;}
  .chip{
    border:1.5px solid var(--line); background:var(--card); border-radius:999px;
    padding:8px 15px; font-size:13px; font-weight:600; cursor:pointer; font-family:inherit; color:var(--ink);
  }
  .chip.on{background:var(--blue); border-color:var(--blue); color:#fff;}
  .chip.refresh{margin-left:auto;}
  .notice{
    font-size:12.5px; color:var(--sub); line-height:1.6; background:var(--card);
    border:1px solid var(--line); border-radius:12px; padding:10px 14px; margin-bottom:14px;
  }
  .list{display:flex; flex-direction:column; gap:8px;}
  .stu{
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:12px 14px; display:flex; align-items:center; gap:12px;
  }
  .stu .rank{width:26px; text-align:center; font-weight:800; font-size:14px; color:var(--sub);}
  .stu .rank.top{color:var(--gold); font-size:17px;}
  .stu .num{
    min-width:26px; height:26px; padding:0 6px; background:var(--blue-soft); color:var(--blue-deep);
    border-radius:999px; font-size:12px; font-weight:700; display:flex; align-items:center; justify-content:center;
  }
  .stu .name{font-weight:700; font-size:15px; flex:1;}
  .bar-wrap{flex:2; height:8px; background:#EEF3F8; border-radius:99px; overflow:hidden; min-width:60px;}
  .bar{height:100%; background:var(--blue); border-radius:99px; transition:width .3s;}
  .count{font-weight:800; font-size:17px; width:34px; text-align:center;}
  .btn{
    border:none; border-radius:10px; width:40px; height:36px; font-size:17px; font-weight:800;
    cursor:pointer; font-family:inherit; transition:transform .1s;
  }
  .btn:active{transform:scale(.92);}
  .plus{background:var(--blue); color:#fff;}
  .minus{background:#F1F5F9; color:var(--sub);}
  .btn:disabled{opacity:.4; cursor:default;}
  .loading{text-align:center; color:var(--sub); padding:60px 0; font-size:14px;}
  h3.sec{font-size:15px; margin:26px 0 10px;}
  .log{
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:6px 16px; font-size:13px;
  }
  .log-row{display:flex; gap:10px; padding:9px 0; border-bottom:1px solid #F1F5F9; align-items:center;}
  .log-row:last-child{border-bottom:none;}
  .log-row .when{color:var(--sub); font-size:12px; width:110px;}
  .log-row .minus-mark{color:var(--red);}
  .empty{color:var(--sub); text-align:center; padding:24px 0; font-size:13px;}
  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(80px);
    background:var(--ink); color:#fff; font-size:13.5px; padding:11px 20px; border-radius:99px;
    opacity:0; transition:all .25s; pointer-events:none; white-space:nowrap;
  }
  .toast.show{transform:translateX(-50%) translateY(0); opacity:1;}
</style>
</head>
<body>

<header>
  <div class="logo">영어 <span>발표 카운터</span> 🎤</div>
  <div class="sync"><span class="dot" id="syncDot"></span><span id="syncText">불러오는 중…</span></div>
</header>

<main>
  <div class="notice">
    이 버전은 <b>이 기기·이 브라우저에만</b> 저장돼요. 다른 기기로 옮길 땐 아래 [내보내기 → 불러오기]를 쓰면 됩니다.
  </div>
  <div class="toolbar">
    <button class="chip on" id="sortNum">번호순</button>
    <button class="chip" id="sortCount">횟수순</button>
    <button class="chip" id="exportBtn">내보내기</button>
    <button class="chip" id="importBtn">불러오기</button>
    <input type="file" id="importFile" accept=".json" style="display:none">
    <button class="chip refresh" id="refreshBtn">↻ 새로고침</button>
  </div>
  <div class="list" id="list"><div class="loading">명단 불러오는 중…</div></div>

  <h3 class="sec">최근 기록</h3>
  <div class="log" id="log"><div class="empty">아직 기록이 없어요</div></div>
</main>

<div class="toast" id="toast"></div>

<script>
"use strict";
const STUDENTS = ["강수빈","고은","김도경","김서하","김시현","김어진","김연아B","김연준","김우준","김윤아","김윤진","김이안","김태경","김하희","남서진","노지원","박재범","박재희","선윤희","오경택","오승현","유서현","이정진","이혁재","정선하","정예담","정지윤","조영서","조윤빈","조윤채","최용석","허이솔","황정현"];
const KEY = "eng-presentation-data";
const MAX_LOG = 150;

let data = { counts:{}, log:[] };   // counts: {"1": 3, ...}, log: [{n, d, ts}] 최신이 앞
let sortMode = "num";
let busy = false;

function setSync(ok, text){
  const dot = document.getElementById("syncDot");
  dot.className = "dot " + (ok===true?"ok": ok===false?"bad":"");
  document.getElementById("syncText").textContent = text;
}
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove("show"), 1800);
}
function fmt(ts){
  const d = new Date(ts);
  const p = n=>String(n).padStart(2,"0");
  return `${p(d.getMonth()+1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

let memOnly = false;
async function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw) data = JSON.parse(raw);
    setSync(true, "이 기기에 저장 중");
  }catch(e){
    memOnly = true;
    setSync(false, "임시 모드 — 창 닫기 전에 [내보내기]로 백업하세요");
  }
  render();
}
async function save(){
  try{
    if(memOnly) throw 0;
    localStorage.setItem(KEY, JSON.stringify(data));
    setSync(true, "저장됨 (이 기기)");
  }catch(e){
    memOnly = true;
    setSync(false, "임시 모드 — [내보내기]로 백업 필수");
  }
  return true; // 저장 실패해도 메모리로 계속 동작
}

async function change(n, delta){
  if(busy) return;
  busy = true; render();
  const cur = data.counts[n] || 0;
  const next = cur + delta;
  if(next < 0){ busy = false; render(); return; }
  data.counts[n] = next;
  data.log.unshift({n, d:delta, ts:Date.now()});
  if(data.log.length > MAX_LOG) data.log.length = MAX_LOG;
  const ok = await save();
  if(ok) toast(`${STUDENTS[n-1]} ${delta>0?"+1! 🎤":"-1 취소"}  (총 ${next}회)`);
  busy = false;
  render();
}

function render(){
  const order = STUDENTS.map((_,i)=>i+1);
  if(sortMode === "count"){
    order.sort((a,b)=>(data.counts[b]||0)-(data.counts[a]||0) || a-b);
  }
  const max = Math.max(1, ...order.map(n=>data.counts[n]||0));
  const list = document.getElementById("list");
  list.innerHTML = "";
  order.forEach((n, i)=>{
    const c = data.counts[n]||0;
    const row = document.createElement("div");
    row.className = "stu";
    const rankHtml = sortMode==="count"
      ? `<div class="rank ${i===0&&c>0?"top":""}">${i===0&&c>0?"👑":(i+1)}</div>`
      : `<div class="rank"></div>`;
    row.innerHTML = `
      ${rankHtml}
      <div class="num">${n}</div>
      <div class="name">${STUDENTS[n-1]}</div>
      <div class="bar-wrap"><div class="bar" style="width:${(c/max)*100}%"></div></div>
      <div class="count">${c}</div>
      <button class="btn minus" ${busy?"disabled":""} title="잘못 눌렀을 때 취소">−</button>
      <button class="btn plus" ${busy?"disabled":""} title="발표 +1">＋</button>`;
    row.querySelector(".plus").addEventListener("click", ()=>change(n, +1));
    row.querySelector(".minus").addEventListener("click", ()=>change(n, -1));
    list.appendChild(row);
  });

  const log = document.getElementById("log");
  if(!data.log.length){
    log.innerHTML = `<div class="empty">아직 기록이 없어요 — 첫 발표자가 나오면 여기 남아요</div>`;
  }else{
    log.innerHTML = "";
    data.log.slice(0, 30).forEach(e=>{
      const r = document.createElement("div");
      r.className = "log-row";
      r.innerHTML = `<span class="when">${fmt(e.ts)}</span>
        <span>${STUDENTS[e.n-1]}</span>
        <span class="${e.d<0?"minus-mark":""}">${e.d>0?"발표 +1":"−1 (취소)"}</span>`;
      log.appendChild(r);
    });
  }
}

document.getElementById("sortNum").addEventListener("click", function(){
  sortMode = "num";
  this.classList.add("on"); document.getElementById("sortCount").classList.remove("on");
  render();
});
document.getElementById("sortCount").addEventListener("click", function(){
  sortMode = "count";
  this.classList.add("on"); document.getElementById("sortNum").classList.remove("on");
  render();
});
document.getElementById("refreshBtn").addEventListener("click", load);
document.getElementById("exportBtn").addEventListener("click", ()=>{
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "영어발표_백업.json";
  a.click();
  URL.revokeObjectURL(a.href);
});
document.getElementById("importBtn").addEventListener("click", ()=>document.getElementById("importFile").click());
document.getElementById("importFile").addEventListener("change", (e)=>{
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = async ()=>{
    try{
      const d = JSON.parse(r.result);
      if(!d.counts || !d.log) throw 0;
      data = d; await save(); render();
      toast("불러오기 완료!");
    }catch(err){ alert("파일을 읽지 못했어요. 이 앱에서 내보낸 백업이 맞는지 확인해주세요."); }
  };
  r.readAsText(f);
  e.target.value = "";
});

load();
</script>
</body>
</html>
